name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: cd breedtimer && chmod +x gradlew && gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: breedtimer-mod
          path: breedtimer/build/libs/breedtimer-*.jar
