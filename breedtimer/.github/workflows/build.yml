name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission to gradlew
        run: chmod +x breedtimer/gradlew

      - name: Build mod
        run: cd breedtimer && ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: breedtimer-mod
          path: breedtimer/build/libs/breedtimer-*.jar
          if-no-files-found: error
